# Replay farm copy of upstream's ci-server.yaml: test CI only, read-only token, no secrets,
# no publish, deploy or comment steps. Generated by evals/scripts/replay-farm/overlay.ts; don't edit by hand.

name: CI Server

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  SERVER_BUILD_CACHE_KEY: server-build
  NODE_COMPILE_CACHE: ${{ github.workspace }}/.cache/node-compile

jobs:
  changed-files-check:
    if: github.event_name != 'merge_group'
    uses: ./.github/workflows/changed-files.yaml
    with:
      files: |
        package.json
        yarn.lock
        packages/twenty-server/**
        packages/twenty-front/src/generated/**
        packages/twenty-front/src/generated-metadata/**
        packages/twenty-front/src/generated-admin/**
        packages/twenty-client-sdk/**
        packages/twenty-emails/**
        packages/twenty-shared/**

  server-build:
    needs:
      - changed-files-check
    if: needs.changed-files-check.outputs.any_changed == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Fetch custom Github Actions and base branch history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 10
      - name: "Replay farm: restore upstream's CI files (upstream's tests read them)"
        shell: bash
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          src=.github/replay-farm/upstream
          [ -d "$src" ] || exit 0
          list="$RUNNER_TEMP/replay-farm-restore"
          (cd "$src" && find . -type f | sed 's|^\./||') > "$list"
          if git rev-parse --git-dir >/dev/null 2>&1; then
            git --literal-pathspecs ls-files -z -- .github/replay-farm | xargs -0 -r git --literal-pathspecs update-index --skip-worktree --
            exclude="$(git rev-parse --git-path info/exclude)"
            mkdir -p "$(dirname "$exclude")"
            while IFS= read -r f; do
              if git --literal-pathspecs ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
                git --literal-pathspecs update-index --skip-worktree -- "$f"
              else printf '/%s\n' "$(printf '%s' "$f" | sed -e 's/[][*?\\!#]/\\&/g' -e 's/ $/\\ /')" >> "$exclude"; fi
            done < "$list"
          fi
          cp -R "$src/." .
          rm -rf .github/replay-farm
      - name: Install dependencies
        uses: ./.github/actions/yarn-install
      - name: Restore server build cache
        id: restore-server-build-cache
        uses: ./.github/actions/restore-cache
        with:
          key: ${{ env.SERVER_BUILD_CACHE_KEY }}
      - name: Build twenty-shared
        run: npx nx build twenty-shared
      - name: Server / Write .env
        run: npx nx reset:env twenty-server
      - name: Server / Build
        run: npx nx build twenty-server
      - name: Save server build cache
        uses: ./.github/actions/save-cache
        with:
          key: ${{ steps.restore-server-build-cache.outputs.cache-primary-key }}

  server-lint-typecheck:
    needs:
      - changed-files-check
    if: needs.changed-files-check.outputs.any_changed == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Fetch custom Github Actions and base branch history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 10
      - name: "Replay farm: restore upstream's CI files (upstream's tests read them)"
        shell: bash
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          src=.github/replay-farm/upstream
          [ -d "$src" ] || exit 0
          list="$RUNNER_TEMP/replay-farm-restore"
          (cd "$src" && find . -type f | sed 's|^\./||') > "$list"
          if git rev-parse --git-dir >/dev/null 2>&1; then
            git --literal-pathspecs ls-files -z -- .github/replay-farm | xargs -0 -r git --literal-pathspecs update-index --skip-worktree --
            exclude="$(git rev-parse --git-path info/exclude)"
            mkdir -p "$(dirname "$exclude")"
            while IFS= read -r f; do
              if git --literal-pathspecs ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
                git --literal-pathspecs update-index --skip-worktree -- "$f"
              else printf '/%s\n' "$(printf '%s' "$f" | sed -e 's/[][*?\\!#]/\\&/g' -e 's/ $/\\ /')" >> "$exclude"; fi
            done < "$list"
          fi
          cp -R "$src/." .
          rm -rf .github/replay-farm
      - name: Install dependencies
        uses: ./.github/actions/yarn-install
      - name: Build twenty-shared
        run: npx nx build twenty-shared
      - name: Server / Run lint, typecheck & lingui extract
        uses: ./.github/actions/nx-affected
        with:
          tag: scope:backend
          tasks: lint,typecheck,lingui:extract
      # Separate step so compile never races extract on the .po files.
      - name: Server / Run lingui compile
        uses: ./.github/actions/nx-affected
        with:
          tag: scope:backend
          tasks: lingui:compile
  server-test:
    needs:
      - server-build
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Fetch custom Github Actions and base branch history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 10
      - name: "Replay farm: restore upstream's CI files (upstream's tests read them)"
        shell: bash
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          src=.github/replay-farm/upstream
          [ -d "$src" ] || exit 0
          list="$RUNNER_TEMP/replay-farm-restore"
          (cd "$src" && find . -type f | sed 's|^\./||') > "$list"
          if git rev-parse --git-dir >/dev/null 2>&1; then
            git --literal-pathspecs ls-files -z -- .github/replay-farm | xargs -0 -r git --literal-pathspecs update-index --skip-worktree --
            exclude="$(git rev-parse --git-path info/exclude)"
            mkdir -p "$(dirname "$exclude")"
            while IFS= read -r f; do
              if git --literal-pathspecs ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
                git --literal-pathspecs update-index --skip-worktree -- "$f"
              else printf '/%s\n' "$(printf '%s' "$f" | sed -e 's/[][*?\\!#]/\\&/g' -e 's/ $/\\ /')" >> "$exclude"; fi
            done < "$list"
          fi
          cp -R "$src/." .
          rm -rf .github/replay-farm
      - name: Install dependencies
        uses: ./.github/actions/yarn-install
      - name: Restore server build cache
        uses: ./.github/actions/restore-cache
        with:
          key: ${{ env.SERVER_BUILD_CACHE_KEY }}
      - name: Build twenty-shared
        run: npx nx build twenty-shared
      - name: Restore jest transform cache
        id: restore-jest-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 (restore)
        with:
          key: v4-jest-server-unit-${{ matrix.shard }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: v4-jest-server-unit-${{ matrix.shard }}-${{ github.ref_name }}-
          path: .cache/jest/packages/twenty-server
      - name: "Replay farm: fetch the PR base for Tensile"
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --quiet --depth=100 origin "$BASE" "$GITHUB_SHA"
          fi
      - name: Tensile selection (shadow)
        id: tensile
        uses: rsyed94/tensile-action@05313adc9733cfd37a2a1e5efc192a492bf6298b
        continue-on-error: true
        with:
          phase: select
          mode: shadow
          runner: jest
          root: packages/twenty-server
          service-url: https://jiffy-app-production.up.railway.app
          check-run-id: ${{ job.check_run_id }}
          matrix-key: ${{ toJSON(matrix) }}
          shard: ${{ matrix.shard }}/${{ strategy.job-total }}
          report: .jiffy/no-report.json
      - name: Tensile jest recorder
        id: tensile-record
        if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (true) }}
        continue-on-error: true
        uses: rsyed94/tensile-action/jest@05313adc9733cfd37a2a1e5efc192a492bf6298b
        with:
          step: setup
          working-directory: packages/twenty-server
          config: jest.config.mjs
          in-place: "true"
      - name: Server / Run Tests (shard ${{ matrix.shard }}/4)
        run: npx nx run twenty-server:test:ci --shard=${{ matrix.shard }}/4
      - name: Tensile jest collect
        if: ${{ !cancelled() && steps.tensile-record.outcome != 'skipped' }}
        continue-on-error: true
        uses: rsyed94/tensile-action/jest@05313adc9733cfd37a2a1e5efc192a492bf6298b
        with:
          step: collect
      - name: "Replay farm: send the coverage to Tensile"
        if: ${{ success() && steps.tensile-record.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          SERVER: https://jiffy-app-production.up.railway.app
          PART: server-test-${{ matrix.shard }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd "$GITHUB_WORKSPACE/.jiffy" 2>/dev/null || { echo "::warning::no .jiffy directory: nothing recorded"; exit 0; }
          parts=(coverage-*.json)
          [ ${#parts[@]} -gt 0 ] || { echo "::warning::no coverage to send"; exit 0; }
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=jiffy" | jq -r .value)
          echo "::add-mask::$token"
          put() { curl -sS --fail-with-body -X PUT -H "Authorization: Bearer $token" -H "content-type: application/json" --data-binary @"$1" "$SERVER/v1/maps/$GITHUB_REPOSITORY/$GITHUB_SHA/$2/$3"; echo; }
          for f in "${parts[@]}"; do case "$f" in *-nodes.json | *-nodes.always-run.json) continue;; esac; put "$f" parts "$PART-${f%.json}"; done
          for f in report-*.json; do put "$f" durations "$PART-${f%.json}"; done
      - name: Save jest transform cache
        if: always() && steps.restore-jest-cache.outputs.cache-hit != 'true' && format('{0}', github.event.pull_request.head.repo.fork) != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 (save)
        with:
          key: ${{ steps.restore-jest-cache.outputs.cache-primary-key }}
          path: .cache/jest/packages/twenty-server
    permissions:
      contents: read
      id-token: write
